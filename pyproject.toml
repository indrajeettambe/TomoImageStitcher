# Install with: pip install -e ".[gpu12]"   (CUDA 11: .[gpu11], CPU-only: .)

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomo-image-stitcher"
# Single source of truth for the version is __init__.py; read it from there
# rather than repeating the string, so the two cannot drift apart.
dynamic = ["version"]
description = "GPU-accelerated 3D volumetric stitcher for tomographic and microscopy volumes."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Endri Lacaj"},
    {name = "Indrajeet Tambe"},
]
keywords = ["stitching", "tomography", "registration", "GPU", "CuPy", "volume-stitching", "3D"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.9"
# CuPy is deliberately NOT a normal dependency. Its wheels are built against a
# specific CUDA version, so a single pin installs a wheel that cannot work for
# anyone on a different driver: the import succeeds and the first kernel launch
# fails with cudaErrorInsufficientDriver. Pick one of the gpu11 / gpu12 extras
# instead. See docs/installation.md.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "h5py>=3.8",
    "tifffile>=2023.4",
    "imagecodecs>=2023.1",
    "SimpleITK>=2.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
gpu11 = ["cupy-cuda11x>=13.0"]
gpu12 = ["cupy-cuda12x>=13.0"]
danmax = [
    "ipywidgets>=8.0",
    "pyFAI>=2023.1",
    "pytz>=2023.3",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "notebook>=7.0",
]
dev = [
    "pytest>=7.3",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.12",
    # tomllib is 3.11+; the packaging tests read pyproject.toml on 3.9/3.10 too.
    "tomli>=2.0; python_version < '3.11'",
]
# The GPU extras are deliberately excluded: they are mutually exclusive and
# depend on the machine, so "all" would have to guess the user's CUDA version.
all = ["tomo-image-stitcher[danmax,notebook,dev]"]

[project.urls]
Homepage = "https://github.com/indrajeettambe/TomoImageStitcher"
Issues = "https://github.com/indrajeettambe/TomoImageStitcher/issues"
Documentation = "https://github.com/indrajeettambe/TomoImageStitcher/tree/main/docs"

[tool.setuptools.dynamic]
version = {attr = "tomo_image_stitcher.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tomo_image_stitcher*"]

[tool.setuptools.package-data]
tomo_image_stitcher = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::RuntimeWarning",
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "gpu: marks tests that require a CUDA-capable GPU",
]
